<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/toki.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toki</title>
    <!-- Apply a background before the bundled styles arrive. The native window stays
         hidden until the saved preference has been reconciled with the system theme. -->
    <script>
      var t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      try {
        var pref = localStorage.getItem("toki:theme");
        var cached = localStorage.getItem("toki:theme-resolved");
        if (pref === "light" || pref === "dark") t = pref;
        else if (cached === "light" || cached === "dark") t = cached;
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    </script>
    <style>
      html { background: #08090a; color-scheme: dark; }
      html[data-theme="light"] { background: #ffffff; color-scheme: light; }
      body { margin: 0; background: inherit; }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
