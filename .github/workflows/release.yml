name: Release

# Pushing a `v*` tag builds the Windows installer and the Linux packages on their own
# runners and collects them into a *draft* release. Nothing is published until someone has
# read the notes and pressed the button.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.3.0"
        required: true
      # For adding a platform to a release after the fact: the packages are built from
      # this commit and still go to the tag's release. Empty builds the tag itself.
      ref:
        description: "Branch or commit to build instead of the tag (optional)"
        required: false
        default: ""
      # Leaves the release's Windows installer exactly as it is, e.g. one uploaded by hand.
      linux_only:
        description: "Build only the Linux packages"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 is the oldest supported Ubuntu, because a binary links against the
        # glibc it was built on and runs only where that one or newer is present. A tag push
        # has no inputs, so it always builds both.
        os: ${{ fromJSON(inputs.linux_only && '["ubuntu-22.04"]' || '["windows-latest", "ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev rpm

      - name: Install frontend dependencies
        working-directory: crates/toki-gui/ui
        run: bun install --frozen-lockfile

      # Runs scripts/prebuild-gui.{ps1,sh} first, which builds the daemon sidecar and the
      # frontend, then bundles: NSIS on Windows, deb and rpm on Linux.
      - name: Build and bundle
        working-directory: crates/toki-gui
        run: ./ui/node_modules/.bin/tauri build

      # For distributions with neither dpkg nor rpm — Arch among them. The same files the
      # packages hold, plus a script that installs them for one user without root.
      - name: Linux tarball
        if: runner.os == 'Linux'
        run: |
          version="${TAG#v}"
          dir="toki-$version-linux-x86_64"
          mkdir -p "$dir/icons"
          cp target/release/toki target/release/toki-daemon scripts/install-linux.sh "$dir/"
          cp crates/toki-gui/icons/32x32.png crates/toki-gui/icons/128x128.png "$dir/icons/"
          tar czf "target/release/bundle/$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/*.tar.gz
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # `releases/latest/download/<name>` only resolves a name every release shares, so each
      # file goes up a second time without its version. The website links to these.
      - name: Copy under stable names
        run: |
          copy() {
            f=$(find dist -type f -name "$1" | head -n 1)
            if [ -n "$f" ]; then cp "$f" "dist/$2"; fi
          }
          copy 'Toki_*_x64-setup.exe' Toki-x64-setup.exe
          copy 'toki-*-linux-x86_64.tar.gz' toki-linux-x86_64.tar.gz
          copy 'Toki_*_amd64.deb' Toki-amd64.deb
          copy 'Toki-*.x86_64.rpm' Toki-x86_64.rpm

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files=$(find dist -type f)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --draft --title "Toki ${TAG#v}" --notes "Draft — notes to follow."
          fi
